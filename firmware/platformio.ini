; mini-spooder firmware (design D1 of openspec/changes/firmware-foundation).
;   robot        the normal image, built and checked by `mise run build`
;   robot-check  the normal image plus the check console (hardware checks only)
;   motion-demo  the normal image plus the motion demonstration (motion-playback D9)
;   native       host tests of the hardware-free core/ library (`mise run test`)
;
; Later changes add sources to src/ and core/, tests to core/test/, and may add
; their own envs or pre: scripts. They do not edit lib_deps, lib_ldf_mode, the
; core/ srcFilter or the warning settings.

[platformio]
default_envs = robot
; PlatformIO accepts test_dir only here; only the native env runs tests.
test_dir = ../core/test

[env:robot]
platform = platformio/espressif8266@4.2.1
framework = arduino
board = esp12e
board_build.flash_mode = dio
board_build.f_flash = 40000000L
; 4 MB, no filesystem: EEPROM sector at 0x3FB000, SDK data at 0x3FC000-0x3FFFFF.
board_build.ldscript = eagle.flash.4m.ld
upload_speed = 460800
monitor_speed = 115200
; With lib_ldf_mode = off, PlatformIO links only the libraries listed here, so
; the framework's EEPROM library (calibration_store) is listed explicitly, as are
; ESP8266WiFi (drive_link: the access point and the UDP drive port) and
; ESP8266WebServer (web-portal's portal.cpp).
lib_deps =
    symlink://../core
    EEPROM
    ESP8266WiFi
    ESP8266WebServer
lib_ldf_mode = off
build_src_flags = -Wall -Wextra -Werror
build_src_filter = +<*> -<check_console.*>
; portal_pages.py (web-portal): generates portal_pages.h into the build directory.
extra_scripts =
    pre:scripts/version.py
    pre:scripts/portal_pages.py

[env:robot-check]
extends = env:robot
build_flags = -DMINI_SPOODER_CHECK_BUILD=1 -DMINI_SPOODER_CHECK_CONSOLE=1
build_src_filter = +<*>

; motion-playback D9: plays the demo sequence after `go` on the serial console.
; A check build (origin `check` permitted) without the check console.
[env:motion-demo]
extends = env:robot
build_flags = -DMINI_SPOODER_CHECK_BUILD=1 -DMOTION_DEMO=1

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = no
; With lib_ldf_mode = off, PlatformIO links only the libraries listed here, so
; Unity (which the test runner installs) is listed explicitly.
lib_deps =
    symlink://../core
    throwtheswitch/Unity@2.6.1
lib_ldf_mode = off
build_flags = -std=gnu++17
