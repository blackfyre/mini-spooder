{{head:Controller}}
<body><main>
{{nav:controller}}
<p class=kicker>Controller</p>
<h1>Spider Robot<i>.</i></h1>
<div class=card onclick="control(event)">
<div class=grid3>
<button type=button data-pm=6>Turn left</button>
<button type=button data-pm=2>Forward</button>
<button type=button data-pm=7>Turn right</button>
<button type=button data-pm=4>Left shift</button>
<button type=button data-pm=3>Backward</button>
<button type=button data-pm=5>Right shift</button>
</div>
<div class=gap></div>
<div class=grid3>
<button type=button data-pm=1>Standby</button>
<button type=button data-pm=9>Say Hi</button>
<button type=button data-pm=11>Push up</button>
<button type=button data-pm=8>Lie</button>
<button type=button data-pm=10>Fighting</button>
<button type=button data-pm=12>Sleep</button>
<button type=button data-pm=13>Dance 1</button>
<button type=button data-pm=14>Dance 2</button>
<button type=button data-pm=15>Dance 3</button>
</div>
</div>
{{status}}
</main>
<script>{{script}}</script>
</body></html>
